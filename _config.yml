title: deliverybot
description: >-
  Simple Continuous Delivery for GitHub
long_description: >-
  Fast, safe and secure Continuous Delivery pipelines you can set up in minutes.
  Hosted for you, or run it yourself. Powered by open source.

logo: /assets/logos/logo-512.png
image: /assets/logos/logo-512.png
social:
  name: Deliverybot
  links:
    - https://github.com/deliverybot/deliverybot

deliverybot_url: https://app.deliverybot.dev
github_app_url: https://github.com/apps/deliverybot
install_url: https://github.com/apps/deliverybot/installations/new
github_org_url: https://github.com/deliverybot
source_url: https://github.com/deliverybot/deliverybot
community_url: https://github.com/deliverybot/deliverybot/issues
start_url: /docs/quickstart/
slack_url: https://app.deliverybot.dev/slack/install
# Lets Slack suggest the app when deliverybot.dev links are shared.
slack_app_id: A0C7YD4S0DD

terms_url: /terms/terms
privacy_url: /terms/privacy
security_url: /terms/security

privacy_email: privacy@deliverybot.dev
support_email: support@deliverybot.dev
security_email: security@deliverybot.dev
corp_name: Deliverybot
service_name: Deliverybot

baseurl: ""
url: https://deliverybot.dev
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: pretty
highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - LICENSE
  - node_modules
  - vendor
